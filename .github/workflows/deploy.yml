name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          # Host toolchain for packing OTP/BEAM wasm apps (runtime is OTP 28.3.1).
          otp-version: "28.3.1"
          elixir-version: "1.19.5"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: mix setup
        run: mix setup
        env:
          SCRIPT_NAME: /popcorn_live_view

      - name: Verify OTP/BEAM wasm artifacts
        run: |
          set -euo pipefail
          test -f static/assets/app.js
          test -f static/assets/beam.wasm
          test -f static/assets/worker.mjs
          test -d static/assets/otp
          ls -la static/assets/ static/assets/otp/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
