name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          # Popcorn 0.3.x requires exact OTP 26.0.2 when compiling the dep.
          otp-version: "26.0.2"
          elixir-version: "1.17.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: mix setup
        run: mix setup
        env:
          SCRIPT_NAME: /popcorn_live_view

      - name: Verify AtomVM runtime artifacts
        run: |
          set -euo pipefail
          test -f static/wasm/bundle.avm
          test -f static/wasm/AtomVM.wasm
          test -f static/wasm/AtomVM.mjs
          test -f static/wasm/popcorn.mjs
          test -f static/wasm/iframe.mjs
          ls -la static/wasm/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
