<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <title>LiveView in WASM</title>
  <!-- fflate: synchronous inflate/deflate for zlib_stub.erl -->
  <script src="fflate.js"></script>
</head>
<body>
  <div id="app">
    <p style="text-align: center; margin-top: 40px; font-family: system-ui;">
      Loading WASM runtime...
    </p>
  </div>
  <script>
    // Restore path after 404.html redirect (SPA deep-link support on GitHub Pages).
    (function () {
      var p = new URLSearchParams(window.location.search).get('p');
      if (!p) return;
      var restored = '/' + p;
      // Normalize deep links like /popcorn_live_view/wokwi/ -> /popcorn_live_view/wokwi
      // so relative asset URLs keep resolving under /popcorn_live_view/.
      if (/\/$/.test(restored) && restored.split('/').filter(Boolean).length > 1) {
        restored = restored.replace(/\/+$/, '');
      }
      window.history.replaceState(null, '', restored);
    })();
  </script>
  <script>
    // Cross-origin isolation for AtomVM (SharedArrayBuffer + module workers):
    // - Localhost: server.exs already sends COOP/COEP/CORP — do NOT use the SW
    //   (it can break pthread reloads of AtomVM.mjs).
    // - GitHub Pages / hosts without those headers: keep the COI service worker
    //   registered and controlling forever. Unregistering after isolation is
    //   achieved leaves worker fetches of AtomVM.mjs without CORP → COEP blocks them.
    (function () {
      function loadApp() {
        var s = document.createElement("script");
        s.type = "module";
        s.src = "assets/app.js";
        document.body.appendChild(s);
      }

      var host = location.hostname;
      var isLocal =
        host === "localhost" || host === "127.0.0.1" || host === "[::1]";

      if (!("serviceWorker" in navigator)) return loadApp();

      if (isLocal) {
        // Prefer native server headers; clear any leftover COI SW from Pages testing.
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            return Promise.all(
              regs.map(function (r) {
                return r.unregister();
              }),
            );
          })
          .catch(function () {})
          .then(loadApp);
        return;
      }

      // Production static hosts (e.g. GitHub Pages): COI SW is required.
      var swVersion = "20260722-3";

      navigator.serviceWorker
        .register("coi-serviceworker.js?v=" + swVersion)
        .then(function (reg) {
          // Force update check so require-corp + CORP SW replaces older builds.
          try {
            reg.update();
          } catch (_e) {}

          if (navigator.serviceWorker.controller) {
            // If a new SW is waiting, activate it then reload once so workers
            // pick up require-corp + CORP (old SWs used credentialless).
            if (reg.waiting) {
              var reloaded = false;
              navigator.serviceWorker.addEventListener("controllerchange", function () {
                if (reloaded) return;
                reloaded = true;
                window.location.reload();
              });
              reg.waiting.postMessage({ type: "SKIP_WAITING" });
              return;
            }
            return loadApp();
          }

          var sw = reg.installing || reg.waiting;
          if (sw) {
            sw.addEventListener("statechange", function (e) {
              if (e.target.state === "activated") window.location.reload();
            });
          } else {
            navigator.serviceWorker.addEventListener("controllerchange", function () {
              window.location.reload();
            });
          }
        })
        .catch(function (err) {
          console.error("SW registration failed:", err);
          loadApp();
        });
    })();
  </script>
</body>
</html>
